# Har bir push va pull request'da loyihani yig'ib, testlarni ishga tushiradi.
# Testlar baza va bot tokenisiz ishlaydi, shuning uchun hech qanday secret kerak emas.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testlar
        run: ./mvnw -B test

      - name: Docker image yig'iladimi
        run: docker build -t movie-bot:ci .
