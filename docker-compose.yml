# Ishga tushirish:  docker compose up -d --build
# Loglar:           docker compose logs -f bot
# To'xtatish:       docker compose down
# Qiymatlar loyiha papkasidagi .env faylidan olinadi (.env.example ga qarang).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: moviebot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env faylida DB_PASSWORD yozilmagan}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/moviebot
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN:?.env faylida BOT_TOKEN yozilmagan}
      BOT_USERNAME: ${BOT_USERNAME:?.env faylida BOT_USERNAME yozilmagan}
      ROOT_ADMIN_ID: ${ROOT_ADMIN_ID:?.env faylida ROOT_ADMIN_ID yozilmagan}
      BOT_GROUP_LINK: ${BOT_GROUP_LINK:-}
      TZ: ${TZ:-Asia/Tashkent}
    # loglar diskni to'ldirib yubormasin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Har kuni bazaning zaxira nusxasi ./backups papkasiga, eskilari BACKUP_KEEP_DAYS kundan keyin o'chadi
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/moviebot-$$(date +%Y%m%d-%H%M%S).sql.gz
          # avval to'liq dump olinadi, xato bo'lsa bo'sh zaxira fayl yaratilmaydi
          if pg_dump -h db -U postgres moviebot > /tmp/dump.sql; then
            gzip -c /tmp/dump.sql > "$$f" && echo "zaxira saqlandi: $$f"
          else
            echo "XATO: zaxira olinmadi"
          fi
          rm -f /tmp/dump.sql
          find /backups -name 'moviebot-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done

volumes:
  db-data:
