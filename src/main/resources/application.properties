spring.application.name=movie-bot

# Loyiha papkasidagi .env faylini ham o'qiydi (lokal ishga tushirish uchun).
# Environment variable'lar .env dagidan ustun turadi (Docker shu yo'l bilan beradi).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moviebot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Sxemani Flyway boshqaradi, Hibernate faqat mosligini tekshiradi
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway'dan oldin yaratilgan bazada V1 bajarilmaydi, faqat keyingi migratsiyalar
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

bot.token=${BOT_TOKEN}
bot.username=${BOT_USERNAME}
bot.root-admin-id=${ROOT_ADMIN_ID}
bot.group-link=${BOT_GROUP_LINK:}
