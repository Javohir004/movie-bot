notfound.1=🔍 Qidirgan narsangiz topilmadi...\n\nBalki boshqa sayyoradandir? 👽\n\nPastdagi "📽 Barchasini ko'rish" tugmasidan mavjud kinolarni ko'rishingiz mumkin.
notfound.2=🕵️‍♂️ Bunday kino yo'q ekan... Sherlok Xolms ham topa olmaydi bu safar!\n\nNom yoki kodni tekshirib qayta yozing, yoki "📽 Barchasini ko'rish" orqali ro'yxatni ko'ring.
notfound.3=😅 Afsus, bazamizda bunday nom yoki kod yo'q.\n\nYozilishini tekshirib qayta urinib ko'ring, yoki pastdagi tugmalardan "🔥 Top 5" yoki "📽 Barchasini ko'rish"ni tanlang.
notfound.4=🙈 Hech narsa chiqmadi. Ehtimol siz uni xayolingizda ixtiro qilgandirsiz?\n\nMavjud kinolarni ko'rish uchun "📽 Barchasini ko'rish" tugmasini bosing.
notfound.5=📭 Bo'sh qoldik... Bunday nom yoki kod bazamizda yo'q.\n\nTo'g'ri yozilganiga ishonch hosil qiling, yoki pastdagi tugmalar orqali mavjud kinolarni ko'ring.

