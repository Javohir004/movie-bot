user.start=👋 Xush kelibsiz!\n\nMen kino, serial va anime botiman. Mana nimalarni qila olaman:\n\n🔍 <b>Qidirish</b> — kino yoki anime nomini (yoki kodini) yozing, men topib beraman\n📽 <b>Barchasini ko'rish</b> — bazamizdagi barcha kino/serial/animelar ro'yxati\n🎭 <b>Janrlar</b> — janr bo'yicha tanlash\n🔥 <b>Top 5</b> — eng ko'p tomosha qilingan kino/seriallar\n\nSeriallar va animelar uchun fasl va qismlarni ham tanlab tomosha qilishingiz mumkin. Boshlash uchun pastdagi tugmalardan birini bosing 👇

