user.start=👋 Welcome!\n\nI'm a bot with movies, series and anime. Here's what I can do:\n\n🔍 <b>Search</b> — type a title (or code) and I'll find it\n📽 <b>Browse all</b> — the full list of movies, series and anime\n🎭 <b>Genres</b> — pick by genre\n🔥 <b>Top 5</b> — the most watched titles\n\nFor series and anime you can choose a season and episode. Tap a button below to start 👇

