user.start=👋 Добро пожаловать!\n\nЯ бот с фильмами, сериалами и аниме. Вот что я умею:\n\n🔍 <b>Поиск</b> — напишите название (или код) фильма или аниме, и я найду его\n📽 <b>Весь каталог</b> — список всех фильмов, сериалов и аниме\n🎭 <b>Жанры</b> — выбор по жанру\n🔥 <b>Топ 5</b> — самые просматриваемые\n\nДля сериалов и аниме можно выбрать сезон и серию. Нажмите одну из кнопок ниже 👇

search.prompt=Напишите название или код фильма:
search.many=Найдено несколько, выберите один:
search.tooMany=Слишком много результатов, показаны первые {0}. Уточните запрос или выберите:
search.suggest=🤔 Точного совпадения нет. Возможно, вы искали один из этих:

notfound.1=🔍 Ничего не найдено...\n\nМожет, этот фильм с другой планеты? 👽\n\nНажмите "📽 Весь каталог", чтобы посмотреть, что есть.
notfound.2=🕵️‍♂️ Такого фильма нет... Даже Шерлок Холмс не нашёл бы!\n\nПроверьте название или код, или откройте "📽 Весь каталог".
notfound.3=😅 Увы, такого названия или кода нет.\n\nПроверьте написание или выберите "🔥 Топ 5" или "📽 Весь каталог".
notfound.4=🙈 Ничего не нашлось. Возможно, вы его придумали?\n\nНажмите "📽 Весь каталог", чтобы увидеть доступные фильмы.
notfound.5=📭 Пусто... Такого названия или кода нет.\n\nПроверьте написание или воспользуйтесь кнопками ниже.

